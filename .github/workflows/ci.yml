name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 工具
        run: |
          pip install ruff
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: 全部检查
        run: STRICT=1 scripts/ci.sh
