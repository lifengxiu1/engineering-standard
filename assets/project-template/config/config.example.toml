# 示例配置。复制为 config/config.toml 再改；真实配置不入库。
# 每个键都写明类型、默认值、范围、含义（标准第 11、25 节）。
version = 1

[log]
level = "info"        # 字符串：error | warn | info | debug | trace。默认 info。环境变量 LOG_LEVEL / RUST_LOG 优先。
format = "json"       # 字符串：json | compact。设备上用 json。

[service]
health_check_interval_s = 30   # 整数秒，1–3600
